<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Firm Valuation | Someday Consultants</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-someday-cream-light text-someday-slate font-body">
    <script>
      // Redirect legacy URL to canonical brand URL.
      // Fail-open: if this script breaks for any reason, the SPA still loads.
      // Only fires on atmix.org; valuation.somedayconsultants.com and localhost are untouched.
      (function () {
        try {
          if (window.location.hostname === 'atmix.org' || window.location.hostname === 'www.atmix.org') {
            window.location.replace('https://valuation.somedayconsultants.com/');
          }
        } catch (e) { /* fail open */ }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
