<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Treatment Wizard | US Mobile IV</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Open+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="wizard.css">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Open Sans', sans-serif;
      background: #0d1f2d;
      color: #f0f4f8;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .test-page {
      text-align: center;
      max-width: 480px;
    }

    .test-page h1 {
      font-family: 'Montserrat', sans-serif;
      font-size: 1.5rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 0.5rem;
    }

    .test-page p {
      font-size: 0.9375rem;
      color: rgba(255,255,255,0.6);
      margin-bottom: 2rem;
      line-height: 1.6;
    }

    .launch-btn {
      display: inline-block;
      padding: 0.875rem 2.5rem;
      font-family: 'Montserrat', sans-serif;
      font-size: 1rem;
      font-weight: 600;
      color: #fff;
      background: #1E4969;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s;
      text-decoration: none;
    }

    .launch-btn:hover {
      background: #2A8A8F;
      transform: translateY(-1px);
    }

    .launch-btn:active {
      transform: translateY(0);
    }

    .secondary-btn {
      display: inline-block;
      margin-top: 1rem;
      padding: 0.5rem 1.5rem;
      font-family: 'Open Sans', sans-serif;
      font-size: 0.875rem;
      color: rgba(255,255,255,0.5);
      background: transparent;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 6px;
      cursor: pointer;
      transition: color 0.2s, border-color 0.2s;
      text-decoration: none;
    }

    .secondary-btn:hover {
      color: rgba(255,255,255,0.8);
      border-color: rgba(255,255,255,0.3);
    }
  </style>
</head>
<body>
  <div id="gate" style="display:none; text-align:center; max-width:360px;">
    <h1 style="font-family:'Montserrat',sans-serif; font-size:1.25rem; font-weight:700; color:#fff; margin-bottom:1rem;">Password Required</h1>
    <input id="gate-input" type="password" placeholder="Enter password" autocomplete="off"
      style="width:100%; padding:0.75rem 1rem; font-family:'Open Sans',sans-serif; font-size:1rem; border:1px solid rgba(255,255,255,0.2); border-radius:8px; background:rgba(255,255,255,0.08); color:#fff; outline:none; margin-bottom:0.75rem;">
    <button id="gate-btn" class="launch-btn" style="width:100%;">Enter</button>
    <p id="gate-error" style="color:#e07a5f; font-size:0.8125rem; margin-top:0.75rem; display:none;">Incorrect password.</p>
  </div>

  <div id="main-content" style="display:none;">
    <div class="test-page">
      <h1>US Mobile IV</h1>
      <p>Interactive treatment recommendation wizard. Click below to try it out.</p>
      <button class="launch-btn" data-treatment-wizard>Find My Treatment</button>
      <br>
      <button class="secondary-btn" onclick="TreatmentWizard.open('test')">Open via JS API</button>
    </div>
  </div>

  <script src="wizard.js"></script>
  <script>
    (function () {
      var KEY = 'usmiv-wizard-unlocked';
      var PASS = 'david';
      var gate = document.getElementById('gate');
      var main = document.getElementById('main-content');
      var input = document.getElementById('gate-input');
      var btn = document.getElementById('gate-btn');
      var err = document.getElementById('gate-error');

      if (sessionStorage.getItem(KEY) === 'true') {
        main.style.display = '';
        return;
      }

      gate.style.display = '';

      function tryUnlock() {
        if (input.value.toLowerCase().trim() === PASS) {
          sessionStorage.setItem(KEY, 'true');
          gate.style.display = 'none';
          main.style.display = '';
        } else {
          err.style.display = '';
          input.value = '';
          input.focus();
        }
      }

      btn.addEventListener('click', tryUnlock);
      input.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') tryUnlock();
      });
      input.focus();
    }());
  </script>
</body>
</html>
