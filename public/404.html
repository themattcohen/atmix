    <title>atmix.org - Matt Cohen, CPA</title>
    <script>
      // GitHub Pages SPA redirect solution
      // Store the path and redirect to the correct SPA
      sessionStorage.redirect = location.href;
      if (location.pathname.startsWith('/creami')) {
        location.replace('/creami/');
      } else {
        location.replace('/');
      }
    </script>
