<svg xmlns="http://www.w3.org/2000/svg" width="280" height="560" viewBox="0 0 280 560" role="img" aria-label="App conversation mockup showing Dr. Stacy responding to a fever question at 11:42pm">

  <!-- Phone shell -->
  <rect x="4" y="4" width="272" height="552" rx="36" ry="36" fill="#2E2620"/>

  <!-- Screen bezel inset -->
  <rect x="12" y="12" width="256" height="536" rx="28" ry="28" fill="#F5F0E8"/>

  <!-- Status bar -->
  <rect x="12" y="12" width="256" height="32" rx="28" ry="0" fill="#F5F0E8"/>
  <!-- Round top corners of status bar naturally from phone shell -->
  <rect x="12" y="28" width="256" height="16" fill="#F5F0E8"/>

  <!-- Status bar content -->
  <text x="28" y="31" font-family="'Inter Tight', 'Helvetica Neue', sans-serif" font-size="10" font-weight="500" fill="#2E2620" opacity="0.6">11:44</text>
  <!-- Signal dots placeholder -->
  <circle cx="236" cy="27" r="2" fill="#2E2620" opacity="0.4"/>
  <circle cx="244" cy="27" r="2" fill="#2E2620" opacity="0.4"/>
  <circle cx="252" cy="27" r="2" fill="#2E2620" opacity="0.55"/>

  <!-- App header bar -->
  <rect x="12" y="44" width="256" height="48" fill="#2E2620"/>

  <!-- App header text -->
  <text x="140" y="73" font-family="'Cormorant Garamond', Georgia, serif" font-size="17" font-weight="400" text-anchor="middle" fill="#F5F0E8">Dr. Stacy</text>

  <!-- Back chevron hint -->
  <polyline points="30,64 24,72 30,80" fill="none" stroke="#F5F0E8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>

  <!-- Online indicator dot -->
  <circle cx="230" cy="72" r="4" fill="#8B6842"/>

  <!-- Chat area background -->
  <rect x="12" y="92" width="256" height="428" fill="#F5F0E8"/>

  <!-- Date separator -->
  <text x="140" y="118" font-family="'Inter Tight', 'Helvetica Neue', sans-serif" font-size="9" font-weight="400" letter-spacing="0.04em" text-anchor="middle" fill="#2E2620" opacity="0.35">TUESDAY</text>

  <!-- Incoming message bubble 1 -->
  <!-- Bubble background — Pale Bone, left-aligned -->
  <rect x="24" y="130" width="186" height="100" rx="4" ry="4" fill="#E8E3DA"/>
  <!-- Bubble tail left bottom -->
  <polygon points="24,222 14,228 24,230" fill="#E8E3DA"/>

  <text x="36" y="150" font-family="'Inter Tight', 'Helvetica Neue', sans-serif" font-size="11" font-weight="400" fill="#2E2620">Hi Dr. Stacy — Maeve</text>
  <text x="36" y="166" font-family="'Inter Tight', 'Helvetica Neue', sans-serif" font-size="11" font-weight="400" fill="#2E2620">spiked a 103 fever an</text>
  <text x="36" y="182" font-family="'Inter Tight', 'Helvetica Neue', sans-serif" font-size="11" font-weight="400" fill="#2E2620">hour ago. Still eating.</text>
  <text x="36" y="198" font-family="'Inter Tight', 'Helvetica Neue', sans-serif" font-size="11" font-weight="400" fill="#2E2620">No rash. Should I worry?</text>

  <!-- Timestamp 1 -->
  <text x="24" y="246" font-family="'Inter Tight', 'Helvetica Neue', sans-serif" font-size="9.5" font-weight="400" fill="#8B6842" opacity="0.85">11:42pm</text>

  <!-- Outgoing message bubble — Oxblood, right-aligned -->
  <rect x="68" y="264" width="188" height="118" rx="4" ry="4" fill="#7B1E1E"/>
  <!-- Bubble tail right bottom -->
  <polygon points="256,374 266,380 256,382" fill="#7B1E1E"/>

  <text x="80" y="284" font-family="'Inter Tight', 'Helvetica Neue', sans-serif" font-size="11" font-weight="400" fill="#F5F0E8">Not yet. Give her Tylenol,</text>
  <text x="80" y="300" font-family="'Inter Tight', 'Helvetica Neue', sans-serif" font-size="11" font-weight="400" fill="#F5F0E8">watch for lethargy or</text>
  <text x="80" y="316" font-family="'Inter Tight', 'Helvetica Neue', sans-serif" font-size="11" font-weight="400" fill="#F5F0E8">rash. I'm on the app.</text>
  <text x="80" y="332" font-family="'Inter Tight', 'Helvetica Neue', sans-serif" font-size="11" font-weight="400" fill="#F5F0E8">Text me if anything</text>
  <text x="80" y="348" font-family="'Inter Tight', 'Helvetica Neue', sans-serif" font-size="11" font-weight="400" fill="#F5F0E8">changes overnight.</text>

  <!-- Timestamp 2 — right-aligned -->
  <text x="256" y="398" font-family="'Inter Tight', 'Helvetica Neue', sans-serif" font-size="9.5" font-weight="400" text-anchor="end" fill="#8B6842" opacity="0.85">11:44pm</text>

  <!-- Message input bar area -->
  <rect x="12" y="480" width="256" height="40" fill="#2E2620" opacity="0.06"/>
  <rect x="24" y="488" width="196" height="24" rx="12" ry="12" fill="#E8E3DA" opacity="0.8"/>
  <text x="42" y="504" font-family="'Inter Tight', 'Helvetica Neue', sans-serif" font-size="10" font-weight="400" fill="#2E2620" opacity="0.35">Message Dr. Stacy</text>
  <!-- Send button circle -->
  <circle cx="240" cy="500" r="12" fill="#2E2620"/>
  <polyline points="234,500 240,494 246,500" fill="none" stroke="#F5F0E8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Bottom tab bar hint -->
  <rect x="12" y="520" width="256" height="28" rx="0" ry="0" fill="#2E2620" opacity="0.04"/>
  <rect x="12" y="520" width="256" height="2" fill="#2E2620" opacity="0.06"/>
  <!-- Home indicator pill -->
  <rect x="105" y="530" width="70" height="4" rx="2" ry="2" fill="#2E2620" opacity="0.2"/>

  <!-- Round bottom corners mask for screen -->
  <rect x="12" y="524" width="256" height="24" rx="0" ry="0" fill="#F5F0E8" opacity="0"/>

  <!-- Phone shell border overlay for crispness -->
  <rect x="4" y="4" width="272" height="552" rx="36" ry="36" fill="none" stroke="#2E2620" stroke-width="2" opacity="0.5"/>

</svg>
