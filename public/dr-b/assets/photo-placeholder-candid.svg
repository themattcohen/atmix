<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-label="Photo placeholder: Dr. Stacy in practice, candid">
  <!-- Background: warm Pale Bone base -->
  <rect width="640" height="360" fill="#E8E3DA"/>

  <!-- Subtle tone variation — left side slightly warmer -->
  <rect x="0" y="0" width="320" height="360" fill="#D9C4A8" opacity="0.4"/>

  <!-- Outer frame -->
  <rect x="24" y="24" width="592" height="312" fill="none" stroke="#2E2620" stroke-width="1.5" opacity="0.3"/>

  <!-- Inner frame accent -->
  <rect x="34" y="34" width="572" height="292" fill="none" stroke="#8B6842" stroke-width="0.75" opacity="0.4"/>

  <!-- Horizontal rule above text -->
  <line x1="260" y1="188" x2="380" y2="188" stroke="#8B6842" stroke-width="1" opacity="0.6"/>

  <!-- Label text -->
  <text x="320" y="212" font-family="'Inter Tight', 'Helvetica Neue', sans-serif" font-size="11" font-weight="500" letter-spacing="0.12em" text-anchor="middle" fill="#2E2620" opacity="0.7">DR. STACY IN PRACTICE</text>
  <text x="320" y="232" font-family="'Inter Tight', 'Helvetica Neue', sans-serif" font-size="10" font-weight="400" letter-spacing="0.04em" text-anchor="middle" fill="#2E2620" opacity="0.5">candid — video consult setup, or stethoscope handoff</text>
  <text x="320" y="250" font-family="'Inter Tight', 'Helvetica Neue', sans-serif" font-size="10" font-weight="400" letter-spacing="0.04em" text-anchor="middle" fill="#2E2620" opacity="0.5">parent's hand in frame, no white coat</text>

  <!-- Corner marks — frame corners only -->
  <g opacity="0.45">
    <line x1="50" y1="50" x2="64" y2="50" stroke="#2E2620" stroke-width="1.5"/>
    <line x1="50" y1="50" x2="50" y2="64" stroke="#2E2620" stroke-width="1.5"/>
    <line x1="590" y1="50" x2="576" y2="50" stroke="#2E2620" stroke-width="1.5"/>
    <line x1="590" y1="50" x2="590" y2="64" stroke="#2E2620" stroke-width="1.5"/>
    <line x1="50" y1="310" x2="64" y2="310" stroke="#2E2620" stroke-width="1.5"/>
    <line x1="50" y1="310" x2="50" y2="296" stroke="#2E2620" stroke-width="1.5"/>
    <line x1="590" y1="310" x2="576" y2="310" stroke="#2E2620" stroke-width="1.5"/>
    <line x1="590" y1="310" x2="590" y2="296" stroke="#2E2620" stroke-width="1.5"/>
  </g>

  <!-- Horizontal rule below text -->
  <line x1="260" y1="264" x2="380" y2="264" stroke="#8B6842" stroke-width="1" opacity="0.4"/>

  <!-- Corner annotation -->
  <text x="610" y="348" font-family="'Inter Tight', 'Helvetica Neue', sans-serif" font-size="9" font-weight="400" letter-spacing="0.03em" text-anchor="end" fill="#8B6842" opacity="0.55">placeholder v1</text>
</svg>
