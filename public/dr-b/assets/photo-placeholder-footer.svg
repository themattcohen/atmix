<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400" role="img" aria-label="Photo placeholder: Dr. Stacy tight portrait">
  <!-- Background: warm Tobacco-tinted fill, slightly darker for footer context -->
  <rect width="400" height="400" fill="#C8B090"/>

  <!-- Subtle tone overlay -->
  <rect x="0" y="200" width="400" height="200" fill="#2E2620" opacity="0.12"/>

  <!-- Outer frame -->
  <rect x="20" y="20" width="360" height="360" fill="none" stroke="#F5F0E8" stroke-width="1" opacity="0.25"/>

  <!-- Inner frame -->
  <rect x="30" y="30" width="340" height="340" fill="none" stroke="#8B6842" stroke-width="0.75" opacity="0.4"/>

  <!-- Corner marks -->
  <g opacity="0.5">
    <line x1="46" y1="46" x2="58" y2="46" stroke="#F5F0E8" stroke-width="1.5"/>
    <line x1="46" y1="46" x2="46" y2="58" stroke="#F5F0E8" stroke-width="1.5"/>
    <line x1="354" y1="46" x2="342" y2="46" stroke="#F5F0E8" stroke-width="1.5"/>
    <line x1="354" y1="46" x2="354" y2="58" stroke="#F5F0E8" stroke-width="1.5"/>
    <line x1="46" y1="354" x2="58" y2="354" stroke="#F5F0E8" stroke-width="1.5"/>
    <line x1="46" y1="354" x2="46" y2="342" stroke="#F5F0E8" stroke-width="1.5"/>
    <line x1="354" y1="354" x2="342" y2="354" stroke="#F5F0E8" stroke-width="1.5"/>
    <line x1="354" y1="354" x2="354" y2="342" stroke="#F5F0E8" stroke-width="1.5"/>
  </g>

  <!-- Divider line above text -->
  <line x1="160" y1="222" x2="240" y2="222" stroke="#F5F0E8" stroke-width="1" opacity="0.4"/>

  <!-- Label text — light on dark-ish background -->
  <text x="200" y="246" font-family="'Inter Tight', 'Helvetica Neue', sans-serif" font-size="11" font-weight="500" letter-spacing="0.12em" text-anchor="middle" fill="#F5F0E8" opacity="0.75">DR. STACY</text>
  <text x="200" y="266" font-family="'Inter Tight', 'Helvetica Neue', sans-serif" font-size="10" font-weight="400" letter-spacing="0.04em" text-anchor="middle" fill="#F5F0E8" opacity="0.55">tight portrait, honest</text>
  <text x="200" y="284" font-family="'Inter Tight', 'Helvetica Neue', sans-serif" font-size="10" font-weight="400" letter-spacing="0.04em" text-anchor="middle" fill="#F5F0E8" opacity="0.55">eyes at camera, no white coat</text>

  <!-- Corner annotation -->
  <text x="372" y="390" font-family="'Inter Tight', 'Helvetica Neue', sans-serif" font-size="9" font-weight="400" letter-spacing="0.03em" text-anchor="end" fill="#8B6842" opacity="0.6">placeholder v1</text>
</svg>
