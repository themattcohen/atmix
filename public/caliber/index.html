const settled = t => t.toFixed(1);

function trace(purity, opts) {
  opts = opts || {};
  const w = 1000, h = opts.h || 200, base = h - 22, top = 20;
  const impurity = Math.max(0.1, 100 - purity);
  const peaks = [
    { c: 0.40, s: 0.026, a: 1 },
    { c: 0.22, s: 0.013, a: Math.min(0.34, impurity * 0.11) },
    { c: 0.63, s: 0.016, a: Math.min(0.26, impurity * 0.08) },
    { c: 0.79, s: 0.011, a: Math.min(0.13, impurity * 0.04) }
  ];
  const pts = [], N = 320;
  for (let i = 0; i <= N; i++) {
    const x = i / N;
    let y = 0;
    for (const p of peaks) y += p.a * Math.exp(-Math.pow(x - p.c, 2) / (2 * p.s * p.s));
    const noise = Math.sin(x * 210) * 0.004 + Math.sin(x * 77) * 0.003;
    pts.push([x * w, base - (Math.min(1, y) * (base - top)) + noise * (base - top)]);
  }
  const d = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  let len = 0;
  for (let i = 1; i < pts.length; i++) len += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
  const stroke = opts.stroke || '#B79A63', grid = opts.grid || '#1D2225';
  let g = '';
  for (let i = 1; i < 6; i++) { const yy = (base / 6) * i; g += `<line x1="0" x2="${w}" y1="${yy}" y2="${yy}" stroke="${grid}" stroke-width="1"/>`; }
  g += `<line x1="0" x2="${w}" y1="${base}" y2="${base}" stroke="${grid}" stroke-width="1.5"/>`;
  const path = `<path d="${d}" fill="none" stroke="${stroke}" stroke-width="2" stroke-linejoin="round" stroke-dasharray="${len}" stroke-dashoffset="0" style="--len:${len}px; animation: cal-draw 1.5s cubic-bezier(.25,.7,.3,1);"/>`;
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="none" style="display:block; overflow:visible;">${g}${path}</svg>`;
}

function panelFor(p) {
  const rows = [
    { k: 'IDENTITY', v: 'CONFIRMED' },
    { k: 'PURITY', v: p.purity.toFixed(1) + '% AREA' },
    { k: 'METHOD', v: p.method.toUpperCase() },
    { k: 'HEAVY METALS', v: 'BELOW LIMIT' },
    { k: 'RESIDUAL SOLVENTS', v: 'BELOW LIMIT' },
    { k: 'ENDOTOXIN', v: '< 0.05 EU/MG' },
    { k: 'LABORATORY', v: p.lab.toUpperCase() },
    { k: 'DATE OF ANALYSIS', v: p.signed }
  ];
  if (p.family === 'Copper') rows.splice(3, 0, { k: 'FREE COPPER', v: 'WITHIN SPEC' });
  if (p.family === 'Secretagogue') rows.splice(3, 0, { k: 'COMPONENT RATIO', v: '1 : 1 CONFIRMED' });
  return rows;
}

  </div>`;
}

/* ---------------- render + actions ---------------- */
function currentView() {
  switch (state.page) {
    case 'catalogue': return viewCatalogue();
    case 'product': return viewProduct();
    case 'testing': return viewTesting();
    case 'clinical': return viewClinical();
    case 'verify': return viewVerify();
    default: return viewHome();
  }
}

function render() {
  document.getElementById('app').innerHTML = header() + currentView() + footer();
}

function nav(page, extra) {
  Object.assign(state, { page: page, openIndex: -1 }, extra || {});
  render();
  window.scrollTo(0, 0);
}

function submitLot() {
  const q = (state.lotInput || '').trim().toUpperCase();
  if (!q) return;
  state.verifying = true; state.result = null; state.notFound = false;
  render();
  clearTimeout(verifyTimer);
  verifyTimer = setTimeout(() => {
    const hit = PRODUCTS.find(p => p.lot === q) || null;
    state.verifying = false; state.result = hit; state.notFound = !hit;
    render();
  }, 640);
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const act = el.getAttribute('data-action');
  switch (act) {
    case 'goHome': nav('home'); break;
    case 'goCatalogue': nav('catalogue'); break;
    case 'goTesting': nav('testing'); break;
    case 'goClinical': nav('clinical'); break;
    case 'goVerify': nav('verify'); break;
    case 'openProduct': e.stopPropagation(); nav('product', { activeIndex: +el.getAttribute('data-index') }); break;
    case 'toggleRow': { const i = +el.getAttribute('data-index'); state.openIndex = state.openIndex === i ? -1 : i; render(); break; }
    case 'selectFamily': state.family = el.getAttribute('data-family'); state.openIndex = -1; render(); break;
    case 'submitLot': submitLot(); break;
    case 'pickLot': state.lotInput = el.getAttribute('data-lot'); submitLot(); break;
  }
});

// lot field: update state without re-rendering (keeps focus); Enter submits
document.addEventListener('input', e => {
  if (e.target && e.target.id === 'lotInput') state.lotInput = e.target.value;
});
document.addEventListener('keydown', e => {
  if (e.target && e.target.id === 'lotInput' && e.key === 'Enter') submitLot();
});

render();
</script>
</body>
</html>
