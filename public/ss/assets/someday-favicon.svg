<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Background: forest green -->
  <rect width="32" height="32" fill="#1D3A28"/>

  <!-- Doorway / threshold mark, scaled to 32x32 -->
  <!-- Left post -->
  <rect x="7" y="9" width="3.5" height="17" fill="#F5F0E8"/>

  <!-- Right post -->
  <rect x="21.5" y="9" width="3.5" height="17" fill="#F5F0E8"/>

  <!-- Lintel -->
  <rect x="7" y="7" width="18" height="3.5" fill="#F5F0E8"/>

  <!-- Gold horizon inside doorway -->
  <line x1="9.5" y1="20" x2="22.5" y2="20" stroke="#B8972E" stroke-width="1.2"/>
</svg>
