<!DOCTYPE html>
<html>
<head>
    <title>Simple RAG Test</title>
    <style>
        body { font-family: system-ui; max-width: 800px; margin: 40px auto; padding: 20px; }
        input { width: 100%; padding: 12px; font-size: 16px; margin-bottom: 20px; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; margin: 5px; }
        .result { border: 1px solid #ddd; padding: 15px; margin: 10px 0; border-radius: 8px; }
        .score { color: #666; font-size: 14px; }
        .source { background: #e0e0e0; padding: 2px 8px; border-radius: 4px; font-size: 12px; }
        #status { padding: 10px; margin: 10px 0; border-radius: 4px; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <h1>Sara Sharp Knowledge Base - Test Page</h1>

    <div id="status">Checking API...</div>

    <input type="text" id="query" placeholder="Type your question here...">

    <div>
        <button onclick="search('How do I value an accounting practice?')">Example 1: Valuation</button>
        <button onclick="search('SBA loans')">Example 2: SBA Loans</button>
        <button onclick="search('due diligence')">Example 3: Due Diligence</button>
    </div>

    <div>
        <button onclick="filterSource('all')" id="btn-all" style="font-weight:bold">All</button>
        <button onclick="filterSource('youtube')" id="btn-youtube">YouTube</button>
        <button onclick="filterSource('blog')" id="btn-blog">Blog</button>
    </div>

    <div id="results"></div>

    <script>
        const API = 'http://127.0.0.1:8000';
        let currentSource = 'all';

        // Check API on load
        fetch(API + '/api/health')
            .then(r => r.json())
            .then(data => {
                document.getElementById('status').className = 'success';
                document.getElementById('status').textContent =
                    `API Connected: ${data.total_chunks} chunks indexed`;
            })
            .catch(err => {
                document.getElementById('status').className = 'error';
                document.getElementById('status').textContent = 'API Error: ' + err.message;
            });

        // Search on Enter
        document.getElementById('query').addEventListener('keypress', e => {
            if (e.key === 'Enter') search(e.target.value);
        });

        function filterSource(source) {
            currentSource = source;
            document.querySelectorAll('button[id^="btn-"]').forEach(b => b.style.fontWeight = 'normal');
            document.getElementById('btn-' + source).style.fontWeight = 'bold';
            const q = document.getElementById('query').value;
            if (q) search(q);
        }

        async function search(query) {
            document.getElementById('query').value = query;
            document.getElementById('results').innerHTML = '<p>Searching...</p>';

            try {
                const response = await fetch(API + '/api/search', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query, top_k: 10, source: currentSource })
                });

                const data = await response.json();

                if (data.results.length === 0) {
                    document.getElementById('results').innerHTML = '<p>No results found.</p>';
                    return;
                }

                document.getElementById('results').innerHTML =
                    `<p><strong>${data.total_results} results</strong> in ${data.query_time_ms}ms</p>` +
                    data.results.map(r => `
                        <div class="result">
                            <span class="source">${r.source_type}</span>
                            <span class="score">Score: ${r.score.toFixed(3)}</span>
                            <h3>${r.title || 'Untitled'}</h3>
                            <p>${r.content.substring(0, 300)}...</p>
                        </div>
                    `).join('');
            } catch (err) {
                document.getElementById('results').innerHTML =
                    '<p style="color:red">Error: ' + err.message + '</p>';
            }
        }
    </script>
</body>
</html>
