<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ask Sara - M&A Expert</title>
    <style>
        :root {
            --bg: #ffffff;
            --bg-secondary: #f8f9fa;
            --text: #1a1a1a;
            --text-secondary: #666;
            --border: #e0e0e0;
            --accent: #2563eb;
            --accent-light: #dbeafe;
            --user-bubble: #2563eb;
            --sara-bubble: #f1f3f5;
            --success: #10b981;
        }

        [data-theme="dark"] {
            --bg: #1a1a1a;
            --bg-secondary: #252525;
            --text: #f0f0f0;
            --text-secondary: #999;
            --border: #333;
            --accent: #3b82f6;
            --accent-light: #1e3a5f;
            --user-bubble: #3b82f6;
            --sara-bubble: #2d2d2d;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            background: var(--bg);
            flex-shrink: 0;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, var(--accent), #1d4ed8);
            color: white;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 16px;
        }

        .logo-text h1 {
            font-size: 1.1rem;
            font-weight: 600;
        }

        .logo-text p {
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        .header-actions {
            display: flex;
            gap: 8px;
        }

        .icon-btn {
            background: none;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 8px 12px;
            cursor: pointer;
            color: var(--text);
            font-size: 14px;
            transition: all 0.2s;
        }

        .icon-btn:hover {
            border-color: var(--accent);
            background: var(--bg-secondary);
        }

        .model-select {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 8px 12px;
            color: var(--text);
            font-size: 14px;
            cursor: pointer;
            outline: none;
            transition: all 0.2s;
        }

        .model-select:hover, .model-select:focus {
            border-color: var(--accent);
        }

        /* Chat Container */
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Messages */
        .message {
            max-width: 85%;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .message.user {
            align-self: flex-end;
        }

        .message.sara {
            align-self: flex-start;
        }

        .message-bubble {
            padding: 14px 18px;
            border-radius: 18px;
            font-size: 15px;
            line-height: 1.5;
        }

        .message.user .message-bubble {
            background: var(--user-bubble);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.sara .message-bubble {
            background: var(--sara-bubble);
            color: var(--text);
            border-bottom-left-radius: 4px;
        }

        .message-meta {
            font-size: 11px;
            color: var(--text-secondary);
            padding: 0 4px;
        }

        .message.user .message-meta {
            text-align: right;
        }

        /* Sources */
        .sources-toggle {
            background: none;
            border: none;
            color: var(--accent);
            font-size: 13px;
            cursor: pointer;
            padding: 4px 0;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .sources-toggle:hover {
            text-decoration: underline;
        }

        .sources-list {
            display: none;
            margin-top: 8px;
            padding: 12px;
            background: var(--bg-secondary);
            border-radius: 12px;
            font-size: 13px;
        }

        .sources-list.expanded {
            display: block;
        }

        .source-item {
            padding: 8px 0;
            border-bottom: 1px solid var(--border);
        }

        .source-item:last-child {
            border-bottom: none;
        }

        .source-title {
            font-weight: 500;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .source-badge {
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 500;
        }

        .source-badge.youtube {
            background: #fee2e2;
            color: #dc2626;
        }

        .source-badge.blog {
            background: #dbeafe;
            color: #2563eb;
        }

        .source-badge.book {
            background: #d1fae5;
            color: #059669;
        }

        .source-badge.newsletter {
            background: #fef3c7;
            color: #d97706;
        }

        .source-excerpt {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 4px;
            font-style: italic;
        }

        .source-score {
            font-size: 11px;
            color: var(--text-secondary);
        }

        /* Typing indicator */
        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 14px 18px;
            background: var(--sara-bubble);
            border-radius: 18px;
            border-bottom-left-radius: 4px;
            width: fit-content;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            background: var(--text-secondary);
            border-radius: 50%;
            animation: typing 1.4s infinite ease-in-out;
        }

        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
            30% { transform: translateY(-4px); opacity: 1; }
        }

        /* Welcome message */
        .welcome {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-secondary);
        }

        .welcome h2 {
            color: var(--text);
            font-size: 1.5rem;
            margin-bottom: 8px;
        }

        .welcome p {
            margin-bottom: 20px;
        }

        .suggestions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            max-width: 600px;
            margin: 0 auto;
        }

        .suggestion-btn {
            padding: 10px 16px;
            border: 1px solid var(--border);
            border-radius: 20px;
            background: var(--bg);
            color: var(--text);
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .suggestion-btn:hover {
            border-color: var(--accent);
            background: var(--accent-light);
        }

        /* Input area */
        .input-area {
            padding: 16px 20px;
            border-top: 1px solid var(--border);
            background: var(--bg);
            flex-shrink: 0;
        }

        .input-wrapper {
            display: flex;
            gap: 12px;
            max-width: 800px;
            margin: 0 auto;
        }

        .input-field {
            flex: 1;
            padding: 14px 18px;
            border: 2px solid var(--border);
            border-radius: 24px;
            background: var(--bg);
            color: var(--text);
            font-size: 15px;
            outline: none;
            resize: none;
            min-height: 48px;
            max-height: 150px;
            transition: border-color 0.2s;
        }

        .input-field:focus {
            border-color: var(--accent);
        }

        .input-field::placeholder {
            color: var(--text-secondary);
        }

        .send-btn {
            width: 48px;
            height: 48px;
            border: none;
            border-radius: 50%;
            background: var(--accent);
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .send-btn:hover:not(:disabled) {
            background: #1d4ed8;
            transform: scale(1.05);
        }

        .send-btn:disabled {
            background: var(--border);
            cursor: not-allowed;
        }

        .send-btn svg {
            width: 20px;
            height: 20px;
        }

        /* Status bar */
        .status-bar {
            text-align: center;
            padding: 8px;
            font-size: 12px;
            color: var(--text-secondary);
            border-top: 1px solid var(--border);
            background: var(--bg-secondary);
        }

        .status-bar.error {
            background: #fee2e2;
            color: #991b1b;
        }

        .status-bar.success {
            background: #d1fae5;
            color: #065f46;
        }

        /* Responsive */
        @media (max-width: 600px) {
            .message {
                max-width: 90%;
            }

            .header-actions .icon-btn span {
                display: none;
            }

            .suggestions {
                flex-direction: column;
            }

            .suggestion-btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">
            <div class="logo-icon">SS</div>
            <div class="logo-text">
                <h1>Ask Sara</h1>
                <p>M&A Expert Assistant</p>
            </div>
        </div>
        <div class="header-actions">
            <select class="model-select" id="model-select" title="Select AI model">
                <option value="haiku">Haiku (Fast)</option>
                <option value="sonnet" selected>Sonnet (Balanced)</option>
                <option value="opus">Opus (Smartest)</option>
            </select>
            <button class="icon-btn" onclick="clearChat()" title="New conversation">
                <span>New Chat</span>
            </button>
            <button class="icon-btn" onclick="toggleTheme()" title="Toggle theme">
                🌓
            </button>
        </div>
    </header>

    <div class="chat-container" id="chat-container">
        <div class="welcome" id="welcome">
            <h2>Hi! I'm Sara.</h2>
            <p>Ask me anything about buying or selling a small business.</p>
            <div class="suggestions">
                <button class="suggestion-btn" onclick="askQuestion('How do I value an accounting practice?')">
                    How do I value an accounting practice?
                </button>
                <button class="suggestion-btn" onclick="askQuestion('What should be in a letter of intent?')">
                    What should be in a letter of intent?
                </button>
                <button class="suggestion-btn" onclick="askQuestion('What are common deal killers?')">
                    What are common deal killers?
                </button>
                <button class="suggestion-btn" onclick="askQuestion('How does SBA financing work?')">
                    How does SBA financing work?
                </button>
            </div>
        </div>
    </div>

    <div class="status-bar" id="status-bar">
        Connecting to knowledge base...
    </div>

    <div class="input-area">
        <div class="input-wrapper">
            <textarea
                class="input-field"
                id="input-field"
                placeholder="Ask Sara a question..."
                rows="1"
                onkeydown="handleKeyDown(event)"
                oninput="autoResize(this)"
            ></textarea>
            <button class="send-btn" id="send-btn" onclick="sendMessage()" disabled>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>
                </svg>
            </button>
        </div>
    </div>

    <script>
        // Use relative URL - works both locally and on Railway
        const API = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
            ? 'http://127.0.0.1:8000'
            : '';
        let isLoading = false;

        // Conversation history for multi-turn support
        let conversationHistory = [];

        // Theme
        function toggleTheme() {
            const current = document.documentElement.dataset.theme;
            const next = current === 'dark' ? 'light' : 'dark';
            document.documentElement.dataset.theme = next;
            localStorage.setItem('theme', next);
        }

        const savedTheme = localStorage.getItem('theme') ||
            (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.dataset.theme = savedTheme;

        // Auto-resize textarea
        function autoResize(el) {
            el.style.height = 'auto';
            el.style.height = Math.min(el.scrollHeight, 150) + 'px';
            document.getElementById('send-btn').disabled = !el.value.trim() || isLoading;
        }

        // Handle Enter key
        function handleKeyDown(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }

        // Clear chat
        function clearChat() {
            // Clear conversation history for new chat
            conversationHistory = [];

            const container = document.getElementById('chat-container');
            container.innerHTML = `
                <div class="welcome" id="welcome">
                    <h2>Hi! I'm Sara.</h2>
                    <p>Ask me anything about buying or selling a small business.</p>
                    <div class="suggestions">
                        <button class="suggestion-btn" onclick="askQuestion('How do I value an accounting practice?')">
                            How do I value an accounting practice?
                        </button>
                        <button class="suggestion-btn" onclick="askQuestion('What should be in a letter of intent?')">
                            What should be in a letter of intent?
                        </button>
                        <button class="suggestion-btn" onclick="askQuestion('What are common deal killers?')">
                            What are common deal killers?
                        </button>
                        <button class="suggestion-btn" onclick="askQuestion('How does SBA financing work?')">
                            How does SBA financing work?
                        </button>
                    </div>
                </div>
            `;
        }

        // Ask a suggestion
        function askQuestion(question) {
            document.getElementById('input-field').value = question;
            autoResize(document.getElementById('input-field'));
            sendMessage();
        }

        // Add message to chat
        function addMessage(content, isUser, sources = null, meta = null) {
            const container = document.getElementById('chat-container');
            const welcome = document.getElementById('welcome');
            if (welcome) welcome.remove();

            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isUser ? 'user' : 'sara'}`;

            let html = `<div class="message-bubble">${escapeHtml(content)}</div>`;

            if (meta) {
                html += `<div class="message-meta">${meta}</div>`;
            }

            if (sources && sources.length > 0) {
                const sourcesId = 'sources-' + Date.now();
                html += `
                    <button class="sources-toggle" onclick="toggleSources('${sourcesId}')">
                        📚 View ${sources.length} sources
                    </button>
                    <div class="sources-list" id="${sourcesId}">
                        ${sources.map(s => `
                            <div class="source-item">
                                <div class="source-title">
                                    <span class="source-badge ${s.source_type}">${formatSourceType(s.source_type)}</span>
                                    ${escapeHtml(s.title)}
                                </div>
                                <div class="source-excerpt">${escapeHtml(s.excerpt)}</div>
                                <div class="source-score">Relevance: ${(s.relevance_score * 100).toFixed(0)}%</div>
                            </div>
                        `).join('')}
                    </div>
                `;
            }

            messageDiv.innerHTML = html;
            container.appendChild(messageDiv);
            container.scrollTop = container.scrollHeight;
        }

        // Add typing indicator
        function addTypingIndicator() {
            const container = document.getElementById('chat-container');
            const indicator = document.createElement('div');
            indicator.className = 'message sara';
            indicator.id = 'typing-indicator';
            indicator.innerHTML = `
                <div class="typing-indicator">
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                </div>
            `;
            container.appendChild(indicator);
            container.scrollTop = container.scrollHeight;
        }

        // Remove typing indicator
        function removeTypingIndicator() {
            const indicator = document.getElementById('typing-indicator');
            if (indicator) indicator.remove();
        }

        // Toggle sources visibility
        function toggleSources(id) {
            const el = document.getElementById(id);
            el.classList.toggle('expanded');
        }

        // Format source type
        function formatSourceType(type) {
            const map = {
                'youtube': 'YouTube',
                'blog': 'Blog',
                'book': 'Book',
                'newsletter': 'Newsletter',
                'ghl_newsletter': 'Newsletter',
                'skandslegal_blog': 'Blog'
            };
            return map[type] || type;
        }

        // Escape HTML
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML.replace(/\n/g, '<br>');
        }

        // Send message
        async function sendMessage() {
            const input = document.getElementById('input-field');
            const question = input.value.trim();

            if (!question || isLoading) return;

            isLoading = true;
            document.getElementById('send-btn').disabled = true;
            input.value = '';
            autoResize(input);

            // Add user message to UI
            addMessage(question, true);

            // Show typing indicator
            addTypingIndicator();

            try {
                const selectedModel = document.getElementById('model-select').value;
                const response = await fetch(API + '/api/ask', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        question,
                        history: conversationHistory,
                        model: selectedModel
                    })
                });

                removeTypingIndicator();

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.detail || 'Request failed');
                }

                const data = await response.json();

                // Add to conversation history for multi-turn context
                conversationHistory.push({ role: 'user', content: question });
                conversationHistory.push({ role: 'assistant', content: data.answer });

                // Keep history manageable (last 10 exchanges = 20 messages)
                if (conversationHistory.length > 20) {
                    conversationHistory = conversationHistory.slice(-20);
                }

                // Add Sara's response to UI
                const meta = `${data.query_time_ms.toFixed(0)}ms · ${data.chunks_used} sources`;
                addMessage(data.answer, false, data.sources, meta);

            } catch (err) {
                removeTypingIndicator();
                addMessage(`Sorry, I encountered an error: ${err.message}. Please try again.`, false);
                updateStatus('error', 'Error: ' + err.message);
            }

            isLoading = false;
            document.getElementById('send-btn').disabled = !input.value.trim();
        }

        // Update status bar
        function updateStatus(type, message) {
            const statusBar = document.getElementById('status-bar');
            statusBar.className = 'status-bar ' + (type || '');
            statusBar.textContent = message;
        }

        // Initialize
        async function init() {
            try {
                const health = await fetch(API + '/api/health').then(r => r.json());
                if (health.status === 'healthy') {
                    updateStatus('success', `Connected: ${health.total_chunks} chunks indexed`);
                    document.getElementById('send-btn').disabled = false;

                    // Hide status after 3 seconds
                    setTimeout(() => {
                        document.getElementById('status-bar').style.display = 'none';
                    }, 3000);
                } else {
                    updateStatus('error', 'Knowledge base not loaded');
                }
            } catch (err) {
                updateStatus('error', 'Cannot connect to API. Is the server running?');
            }
        }

        init();
    </script>
</body>
</html>
