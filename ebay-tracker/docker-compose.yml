services:
  app:
    build: .
    container_name: ebay-watchlist
    restart: unless-stopped
    ports:
      - "3005:3005"
    env_file:
      - .env
    volumes:
      - watchlist-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3005/api/items"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  watchlist-data:
    driver: local
