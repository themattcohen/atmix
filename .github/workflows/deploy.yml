name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Build root site
        run: npm run build

      - name: Install creami-app dependencies
        run: cd creami-app && npm ci

      - name: Build creami-app
        run: cd creami-app && npm run build

      - name: Copy creami-app into dist
        run: |
          rm -rf dist/creami
          cp -r creami-app/dist dist/creami

      - name: Install restaurantweek2026 dependencies
        run: cd restaurantweek2026 && npm ci

      - name: Build restaurantweek2026
        run: cd restaurantweek2026 && npm run build

      - name: Copy restaurantweek2026 into dist
        run: |
          rm -rf dist/restaurantweek2026
          cp -r restaurantweek2026/dist dist/restaurantweek2026

      - name: Install wizard-v2 dependencies
        run: cd usmiv/wizard-v2 && npm ci

      - name: Build wizard-v2
        run: cd usmiv/wizard-v2 && npm run build

      - name: Copy wizard-v2 into dist
        run: |
          mkdir -p dist/wizard-of-iv-v2
          cp usmiv/wizard-v2/dist/wizard.js dist/wizard-of-iv-v2/
          cp usmiv/wizard-v2/dist/wizard.css dist/wizard-of-iv-v2/
          cp usmiv/wizard-v2/demo.html dist/wizard-of-iv-v2/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4