name: D2C FBAR CI

on:
  push:
    branches: [main]
    paths:
      - 'fbar-automator/d2c/**'
      - '.github/workflows/fbar-d2c-ci.yml'
  pull_request:
    paths:
      - 'fbar-automator/d2c/**'
      - '.github/workflows/fbar-d2c-ci.yml'

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fbar-automator/d2c

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Start MinIO and create bucket
        working-directory: .
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio server /data
          for i in $(seq 1 30); do
            curl -sf http://localhost:9000/minio/health/live && break
            sleep 1
          done
          curl -sf http://localhost:9000/minio/health/live || (echo "MinIO failed to start" && exit 1)
          wget -q https://dl.min.io/client/mc/release/linux-amd64/mc -O /tmp/mc && chmod +x /tmp/mc
          /tmp/mc alias set local http://localhost:9000 minioadmin minioadmin
          /tmp/mc mb local/fbar-direct

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: fbar-automator/d2c/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Push schema to test DB
        run: npx prisma db push --accept-data-loss
        env:
          DATABASE_URL: "postgresql://test:test@localhost:5432/test"

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npx vitest run
        env:
          DATABASE_URL: "postgresql://test:test@localhost:5432/test"
          ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
          NEXTAUTH_SECRET: "test-secret-for-ci"
          NEXTAUTH_URL: "http://localhost:3001"
          S3_ENDPOINT: "http://localhost:9000"
          S3_REGION: "us-east-1"
          S3_ACCESS_KEY: "minioadmin"
          S3_SECRET_KEY: "minioadmin"
          S3_BUCKET: "fbar-direct"

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: "postgresql://test:test@localhost:5432/test"
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('fbar-automator/d2c/package-lock.json') }}

      - name: Install Playwright
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright deps (cached)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Seed database
        run: npx prisma db seed
        env:
          DATABASE_URL: "postgresql://test:test@localhost:5432/test"

      - name: Run E2E smoke tests (public pages)
        run: |
          npx playwright test \
            marketing.spec.ts \
            gtm-smoke.spec.ts \
            blog.spec.ts \
            antagonistic/t01-hero.spec.ts \
            antagonistic/t02-sections.spec.ts \
            antagonistic/t03-howitworks-pricing.spec.ts \
            antagonistic/t04-faq-footer.spec.ts \
            antagonistic/t05-navigation.spec.ts
        env:
          DATABASE_URL: "postgresql://test:test@localhost:5432/test"
          ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
          NEXTAUTH_SECRET: "test-secret-for-ci"
          NEXTAUTH_URL: "http://localhost:3001"
          S3_ENDPOINT: "http://localhost:9000"
          S3_REGION: "us-east-1"
          S3_ACCESS_KEY: "minioadmin"
          S3_SECRET_KEY: "minioadmin"
          S3_BUCKET: "fbar-direct"
          NODE_ENV: "production"

      - name: Run E2E auth tests (serial to avoid contention)
        run: |
          npx playwright test --workers=1 \
            auth.spec.ts \
            threshold-keyboard.spec.ts \
            antagonistic/t06-signup.spec.ts \
            antagonistic/t07-login-logout.spec.ts \
            antagonistic/t08-forgot-password.spec.ts \
            antagonistic/t09-threshold.spec.ts \
            antagonistic/t10-personal.spec.ts \
            antagonistic/t11-accounts.spec.ts \
            antagonistic/t12-review-sign.spec.ts \
            antagonistic/t13-payment-dashboard.spec.ts \
            antagonistic/t14-return-filer.spec.ts \
            antagonistic/t15-form114a-download.spec.ts
        env:
          DATABASE_URL: "postgresql://test:test@localhost:5432/test"
          ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
          NEXTAUTH_SECRET: "test-secret-for-ci"
          NEXTAUTH_URL: "http://localhost:3001"
          S3_ENDPOINT: "http://localhost:9000"
          S3_REGION: "us-east-1"
          S3_ACCESS_KEY: "minioadmin"
          S3_SECRET_KEY: "minioadmin"
          S3_BUCKET: "fbar-direct"
          NODE_ENV: "production"

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: fbar-automator/d2c/playwright-report/
          retention-days: 7
