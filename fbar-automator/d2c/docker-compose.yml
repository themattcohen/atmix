version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: fbar_direct
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - d2c_pgdata:/var/lib/postgresql/data

  minio:
    image: minio/minio
    ports:
      - "9002:9000"
      - "9003:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - d2c_minio:/data

volumes:
  d2c_pgdata:
  d2c_minio:
