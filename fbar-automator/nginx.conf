# =============================================================================
# FBAR Automator - Production Nginx Configuration
# =============================================================================
# Reverse proxy with rate limiting, security headers, compression, and caching.
# =============================================================================

worker_processes auto;
worker_rlimit_nofile 8192;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    multi_accept on;
    use epoll;
}

http {
    # -------------------------------------------------------------------------
    # Core Settings
    # -------------------------------------------------------------------------
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    charset       utf-8;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # -------------------------------------------------------------------------
    # Logging
    # -------------------------------------------------------------------------
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time uct=$upstream_connect_time '
                    'uht=$upstream_header_time urt=$upstream_response_time';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # -------------------------------------------------------------------------
    # Rate Limiting Zones
    # -------------------------------------------------------------------------
    # General API: 10 requests/second per client IP
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

    # File uploads: 2 requests/second per client IP
    limit_req_zone $binary_remote_addr zone=upload:10m rate=2r/s;

    # Authentication: 5 requests/minute per client IP (brute force protection)
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;

    # Custom 429 error page
    limit_req_status 429;

    # -------------------------------------------------------------------------
    # Gzip Compression
    # -------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 4;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # -------------------------------------------------------------------------
    # Upload Size Limits
    # -------------------------------------------------------------------------
    client_max_body_size 50m;
    client_body_buffer_size 10m;

    # -------------------------------------------------------------------------
    # Upstream - Next.js Application
    # -------------------------------------------------------------------------
    upstream app {
        server app:3000;
        keepalive 32;
    }

    # -------------------------------------------------------------------------
    # HTTP Server (port 80)
    # -------------------------------------------------------------------------
    server {
        listen 80;
        server_name _;

        # Redirect to HTTPS when SSL is configured.
        # Uncomment the following line and remove the include directive below:
        # return 301 https://$host$request_uri;

        # -- Security Headers -------------------------------------------------
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none';" always;

        # -- Health Check (load balancer / orchestrator) ----------------------
        location /health {
            proxy_pass http://app/api/health;
            proxy_set_header Host $host;
            access_log off;
        }

        # -- Authentication Endpoints (strict rate limit) ---------------------
        location /api/auth/ {
            limit_req zone=auth burst=3 nodelay;
            limit_req_log_level warn;

            proxy_pass http://app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }

        # -- Upload Endpoints (moderate rate limit) ---------------------------
        location /api/statements/upload {
            limit_req zone=upload burst=4 nodelay;
            limit_req_log_level warn;

            proxy_pass http://app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            # Longer timeout for file upload + LLM processing
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        # -- General API (standard rate limit) --------------------------------
        location /api/ {
            limit_req zone=api burst=20 nodelay;
            limit_req_log_level warn;

            proxy_pass http://app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            proxy_read_timeout 120s;

            # No caching for API responses
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        }

        # -- Next.js Static Assets (long-lived cache) ------------------------
        location /_next/static/ {
            proxy_pass http://app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # Immutable hashed assets - cache aggressively
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            access_log off;
        }

        # -- Next.js Image Optimization ---------------------------------------
        location /_next/image {
            proxy_pass http://app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";

            add_header Cache-Control "public, max-age=86400" always;
        }

        # -- Favicon and Static Public Files ----------------------------------
        location ~* \.(ico|png|jpg|jpeg|gif|svg|woff|woff2|ttf|eot)$ {
            proxy_pass http://app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            add_header Cache-Control "public, max-age=604800" always;
            access_log off;
        }

        # -- Default: All Other Requests (Next.js pages) ----------------------
        location / {
            proxy_pass http://app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_read_timeout 120s;
        }

        # -- Custom Error Pages -----------------------------------------------
        error_page 429 /429.html;
        location = /429.html {
            default_type application/json;
            return 429 '{"error":"Too Many Requests","message":"Rate limit exceeded. Please try again later."}';
        }

        error_page 502 503 504 /50x.html;
        location = /50x.html {
            default_type application/json;
            return 503 '{"error":"Service Unavailable","message":"The application is temporarily unavailable. Please try again shortly."}';
        }
    }

