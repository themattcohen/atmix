# =============================================================================
# FBAR Unified Production — B2B + D2C on Single VPS
# =============================================================================
# Usage:
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Prerequisites:
#   - Copy .env.unified.example to .env and set all production values
#   - Set B2B_DOMAIN and D2C_DOMAIN to your domains
#   - See claudedocs/DEPLOY-HETZNER-UNIFIED.md for full setup guide
#
# Architecture:
#   Caddy (auto-TLS) → B2B app (3000) + D2C app (3001)
#   Shared: Postgres (2 DBs), MinIO (2 buckets)
#   B2B only: Redis + Worker
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Caddy — Reverse Proxy & Automatic TLS (Let's Encrypt)
  # Custom build with rate_limit module
  # ---------------------------------------------------------------------------
  caddy:
    build:
      context: ./docker
      dockerfile: Caddy.Dockerfile
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile.prod:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - B2B_DOMAIN=${B2B_DOMAIN:-localhost}
      - D2C_DOMAIN=${D2C_DOMAIN:-localhost}
    depends_on:
      b2b-app:
        condition: service_healthy
      d2c-app:
        condition: service_healthy
    networks:
      - frontend
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    restart: always

  # ---------------------------------------------------------------------------
  # B2B App — FBAR Preparer (Next.js on port 3000)
  # ---------------------------------------------------------------------------
  b2b-app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${B2B_DATABASE_URL}
      - NEXTAUTH_SECRET=${B2B_NEXTAUTH_SECRET}
      - NEXTAUTH_URL=${B2B_NEXTAUTH_URL}
      - S3_ENDPOINT=${S3_ENDPOINT}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - S3_REGION=${S3_REGION}
      - S3_BUCKET=${B2B_S3_BUCKET}
      - REDIS_URL=${REDIS_URL}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - CRON_SECRET=${CRON_SECRET}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - RESEND_FROM_EMAIL=${B2B_RESEND_FROM_EMAIL}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      b2b-migrate:
        condition: service_completed_successfully
    networks:
      - frontend
      - backend
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 384M
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    read_only: true
    tmpfs:
      - /tmp:size=100M
      - /app/.next/cache:size=200M
    restart: always

  # ---------------------------------------------------------------------------
  # B2B Worker — BullMQ Extraction Worker
  # ---------------------------------------------------------------------------
  b2b-worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${B2B_DATABASE_URL}
      - S3_ENDPOINT=${S3_ENDPOINT}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - S3_REGION=${S3_REGION}
      - S3_BUCKET=${B2B_S3_BUCKET}
      - REDIS_URL=${REDIS_URL}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - WORKER_CONCURRENCY=3
      - WORKER_RATE_LIMIT_MAX=${WORKER_RATE_LIMIT_MAX}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 384M
    healthcheck:
      test: ["CMD-SHELL", "node -e 'process.exit(0)'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    read_only: true
    tmpfs:
      - /tmp:size=50M
    restart: always

  # ---------------------------------------------------------------------------
  # B2B Migrate — One-shot Prisma migration (B2B schema)
  # ---------------------------------------------------------------------------
  b2b-migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    command: ["npx", "prisma", "migrate", "deploy"]
    environment:
      - DATABASE_URL=${B2B_DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
    restart: "no"

  # ---------------------------------------------------------------------------
  # D2C App — FBAR Direct Filing (Next.js on port 3001)
  # Image built by GitHub Actions → ghcr.io/themattcohen/fbar-d2c
  # Old build config (for reference):
  #   build:
  #     context: ./d2c
  #     dockerfile: Dockerfile
  #     target: runner
  #     args:
  #       - NEXT_PUBLIC_GTM_ID=${NEXT_PUBLIC_GTM_ID}
  # ---------------------------------------------------------------------------
  d2c-app:
    image: ghcr.io/themattcohen/fbar-d2c:${D2C_IMAGE_TAG:-latest}
    command: ["node", "server.js"]
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${D2C_DATABASE_URL}
      - NEXTAUTH_SECRET=${D2C_NEXTAUTH_SECRET}
      - NEXTAUTH_URL=${D2C_NEXTAUTH_URL}
      - S3_BUCKET=${D2C_S3_BUCKET}
      - STRIPE_SECRET_KEY=${D2C_STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${D2C_STRIPE_WEBHOOK_SECRET}
      - ENCRYPTION_KEY=${D2C_ENCRYPTION_KEY}
      - ANTHROPIC_API_KEY=${D2C_ANTHROPIC_API_KEY}
      - RESEND_API_KEY=${D2C_RESEND_API_KEY}
      - RESEND_FROM_EMAIL=${D2C_RESEND_FROM_EMAIL}
      - SDTM_HOST=${SDTM_HOST}
      - SDTM_PORT=${SDTM_PORT}
      - SDTM_USERNAME=${SDTM_USERNAME}
      - SDTM_PRIVATE_KEY_PATH=${SDTM_PRIVATE_KEY_PATH}
      - SDTM_PASSWORD=${SDTM_PASSWORD}
      - SDTM_REMOTE_DIR=${SDTM_REMOTE_DIR}
      - SDTM_ACK_DIR=${SDTM_ACK_DIR}
      - SDTM_SANDBOX_MODE=${SDTM_SANDBOX_MODE}
      - SDTM_HOST_KEY=${SDTM_HOST_KEY}
      - FINCEN_TRANSMITTER_NAME=${FINCEN_TRANSMITTER_NAME}
      - FINCEN_TRANSMITTER_TIN=${FINCEN_TRANSMITTER_TIN}
      - FINCEN_TRANSMITTER_TCC=${FINCEN_TRANSMITTER_TCC}
      - FINCEN_TRANSMITTER_CONTACT_PHONE=${FINCEN_TRANSMITTER_CONTACT_PHONE}
      - FINCEN_TRANSMITTER_CONTACT_NAME=${FINCEN_TRANSMITTER_CONTACT_NAME}
      - FINCEN_TRANSMITTER_ADDRESS=${FINCEN_TRANSMITTER_ADDRESS}
      - CRON_SECRET=${CRON_SECRET}
      - S3_SERVER_SIDE_ENCRYPTION=${S3_SERVER_SIDE_ENCRYPTION:-}
      - NEXT_PUBLIC_GTM_ID=${NEXT_PUBLIC_GTM_ID}
      - SENTRY_DSN=${SENTRY_DSN}
      - NEXT_PUBLIC_SENTRY_DSN=${NEXT_PUBLIC_SENTRY_DSN}
      - SERPER_API_KEY=${SERPER_API_KEY:-}
      - TURNSTILE_SECRET_KEY=${TURNSTILE_SECRET_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      d2c-migrate:
        condition: service_completed_successfully
    networks:
      - frontend
      - backend
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 384M
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    read_only: true
    tmpfs:
      - /tmp:size=100M
      - /app/.next/cache:size=200M
    restart: always

  # ---------------------------------------------------------------------------
  # D2C Migrate — One-shot Prisma migration (D2C schema)
  # ---------------------------------------------------------------------------
  d2c-migrate:
    image: ghcr.io/themattcohen/fbar-d2c:${D2C_IMAGE_TAG:-latest}
    command: ["npx", "prisma", "migrate", "deploy"]
    environment:
      - DATABASE_URL=${D2C_DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
    restart: "no"

  # ---------------------------------------------------------------------------
  # D2C Cron — Lightweight cron to recover stuck filings (submit-paid + poll-submitted)
  # ---------------------------------------------------------------------------
  d2c-cron:
    image: busybox:latest
    command: >
      sh -c 'mkdir -p /var/spool/cron/crontabs && echo "*/5 * * * * wget -q -O- --header=\"Authorization: Bearer $$CRON_SECRET\" http://d2c-app:3001/api/cron/submit-paid >> /proc/1/fd/1 2>&1 && wget -q -O- --header=\"Authorization: Bearer $$CRON_SECRET\" http://d2c-app:3001/api/cron/poll-submitted >> /proc/1/fd/1 2>&1" | crontab - && crond -f -l 2'
    environment:
      - CRON_SECRET=${CRON_SECRET}
    depends_on:
      d2c-app:
        condition: service_healthy
    networks:
      - frontend
    deploy:
      resources:
        limits:
          cpus: "0.05"
          memory: 16M
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    restart: always

  b2b-cron:
    image: busybox:latest
    command: >
      sh -c 'mkdir -p /var/spool/cron/crontabs && echo "0 6 * * * wget -q -O- --header=\"Authorization: Bearer $$CRON_SECRET\" http://b2b-app:3000/api/cron/sync-rates >> /proc/1/fd/1 2>&1" | crontab - && crond -f -l 2'
    environment:
      - CRON_SECRET=${CRON_SECRET}
    depends_on:
      b2b-app:
        condition: service_healthy
    networks:
      - frontend
    deploy:
      resources:
        limits:
          cpus: "0.05"
          memory: 16M
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    restart: always

  # ---------------------------------------------------------------------------
  # PostgreSQL — Shared Database (fbar_automator + fbar_direct)
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: fbar_automator
      # Passed to init-db.sh for creating per-app database users
      POSTGRES_B2B_PASSWORD: ${POSTGRES_B2B_PASSWORD}
      POSTGRES_D2C_PASSWORD: ${POSTGRES_D2C_PASSWORD}
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=192MB"
      - "-c"
      - "work_mem=4MB"
      - "-c"
      - "maintenance_work_mem=64MB"
      - "-c"
      - "max_connections=80"
      - "-c"
      - "effective_cache_size=384MB"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "wal_buffers=8MB"
      - "-c"
      - "default_statistics_target=100"
      - "-c"
      - "log_min_duration_statement=1000"
      - "-c"
      - "log_checkpoints=on"
      - "-c"
      - "log_connections=on"
      - "-c"
      - "log_disconnections=on"
      - "-c"
      - "log_lock_waits=on"
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
      - ./docker/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 768M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: always

  # ---------------------------------------------------------------------------
  # Redis — B2B Job Queue (BullMQ)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    command:
      - "redis-server"
      - "--appendonly"
      - "yes"
      - "--appendfsync"
      - "everysec"
      - "--requirepass"
      - "${REDIS_PASSWORD}"
      - "--maxmemory"
      - "100mb"
      - "--maxmemory-policy"
      - "noeviction"
      - "--tcp-backlog"
      - "511"
      - "--timeout"
      - "300"
      - "--tcp-keepalive"
      - "60"
      - "--loglevel"
      - "notice"
    volumes:
      - redis_data:/data
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    restart: always

  # ---------------------------------------------------------------------------
  # MinIO — Shared S3-Compatible Object Storage
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
      - minio_data:/data
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 192M
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    restart: always

# =============================================================================
# Networks
# =============================================================================
networks:
  # Caddy <-> app containers
  frontend:
    driver: bridge
  # Apps <-> postgres, redis, minio (no external access)
  backend:
    driver: bridge
    internal: true

# =============================================================================
# Volumes
# =============================================================================
volumes:
  pgdata_prod:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local
