<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wizard of IV v2 -- Dev Test</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px;
      color: #333;
    }
    h1 { margin-bottom: 8px; }
    p { color: #666; margin-bottom: 24px; }
    .trigger-btn {
      display: inline-block;
      padding: 16px 32px;
      background: #2A8A8F;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 18px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .trigger-btn:hover { background: #237175; }
    .info { margin-top: 32px; padding: 16px; background: #f5f5f5; border-radius: 8px; font-size: 14px; }
  </style>
</head>
<body>
  <h1>Wizard of IV v2 -- Dev Test Page</h1>
  <p>Click the button below to open the treatment wizard.</p>

  <button class="trigger-btn" data-treatment-wizard>Find My Treatment</button>

  <div class="info">
    <strong>Dev tools:</strong>
    <ul>
      <li>Add <code>?wizard-dev=true</code> to URL for the dev dashboard</li>
      <li>Press <code>Ctrl+Shift+W</code> to toggle the dev dashboard</li>
      <li>Open browser console to see validation output</li>
    </ul>
  </div>

  <script type="module" src="/src/index.ts"></script>
</body>
</html>
